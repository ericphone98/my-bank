<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>活期存摺 Pro</title>
    <style>
        :root { --hk-blue: #007aff; --hk-orange: #ff9500; --bg: #f2f2f7; --card-bg: #ffffff; --predict: #5856d6; --withdraw: #ff453a; --predict-bg: #f5f3ff; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; 
            padding: env(safe-area-inset-top) 10px 0 10px;
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }

        .header-section { flex-shrink: 0; }
        .account-tabs { display: flex; gap: 5px; overflow-x: auto; padding: 8px 0; scrollbar-width: none; }
        .tab { padding: 6px 12px; background: #d1d1d6; border-radius: 8px; font-size: 12px; white-space: nowrap; border: none; }
        .tab.active { background: var(--hk-blue); color: white; font-weight: bold; }

        .display-card { 
            background: var(--hk-blue); color: white; padding: 12px 15px; border-radius: 18px; 
            margin-bottom: 8px; position: relative;
        }
        .display-card.is-predicting { background: var(--predict); }
        .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
        .amount { font-size: 28px; font-weight: bold; display: block; margin: 2px 0; }
        .breakdown { font-size: 11px; opacity: 0.9; }
        
        .target-input { 
            background: rgba(255,255,255,0.2); border: none; border-radius: 6px; 
            color: white; font-size: 11px; padding: 2px 5px; width: 110px;
        }

        .input-card { background: var(--card-bg); padding: 10px; border-radius: 12px; margin-bottom: 8px; }
        .input-row { display: flex; gap: 6px; margin-bottom: 8px; align-items: flex-end; }
        .field { flex: 1; min-width: 0; }
        label { display: block; font-size: 10px; color: #8e8e93; margin-bottom: 2px; font-weight: bold; }
        input { 
            width: 100%; padding: 8px; border: 1px solid #d1d1d6; border-radius: 8px; 
            font-size: 14px; background: #f9f9f9; height: 36px;
        }
        
        .btn { flex: 1; height: 38px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 14px; }

        /* 紀錄清單對齊優化 */
        .log-container { 
            flex-grow: 1; overflow-y: auto; background: white; 
            border-radius: 15px 15px 0 0; 
            padding-bottom: calc(env(safe-area-inset-bottom) + 100px); 
            -webkit-overflow-scrolling: touch;
        }
        
        .log-item { 
            display: flex; justify-content: space-between; padding: 12px 15px; 
            border-bottom: 1px solid #f2f2f7; align-items: center; 
        }
        .log-info { display: flex; flex-direction: column; flex: 1; }
        .log-date { font-size: 10px; color: #8e8e93; }
        
        /* 金額右對齊核心樣式 */
        .log-amt-wrapper { 
            display: flex; align-items: center; justify-content: flex-end; 
            min-width: 120px; text-align: right; 
        }
        .log-amt { 
            font-family: 'Courier New', Courier, monospace; /* 使用等寬字型確保對齊 */
            font-weight: 600; font-size: 15px; flex: 1;
        }
        .amt-pos { color: #34c759; }
        .amt-neg { color: var(--withdraw); }
        .amt-int { color: var(--predict); }

        .del-btn { border: none; background: none; opacity: 0.2; padding: 0 0 0 10px; font-size: 14px; }
        
        #syncStatus { text-align:center; font-size:9px; color:#8e8e93; padding: 4px 0; }
        .sync-option { font-size: 10px; color: #444; display: flex; align-items: center; gap: 3px; margin-top: 5px; justify-content: center; }
    </style>
</head>
<body>

<div class="header-section">
    <div id="syncStatus">● 同步中...</div>
    <div class="account-tabs" id="accountTabs"></div>

    <div class="display-card" id="mainCard">
        <div class="card-header">
            <span id="accountTitle">---</span>
            <div>
                <span style="opacity:0.8">預測至: </span>
                <input type="date" id="targetDate" class="target-input" onchange="runCalculation()">
            </div>
        </div>
        <span class="amount" id="totalDisplay">HK$ 0.00</span>
        <div class="breakdown" id="breakdownDisplay">本金: 0.00 | 利息: 0.00</div>
    </div>

    <div class="input-card">
        <div class="input-row">
            <div class="field"><label>💰 金額</label><input type="number" id="transAmt" placeholder="0.00" inputmode="decimal"></div>
            <div class="field"><label>📅 交易日期</label><input type="date" id="transDate"></div>
        </div>
        <div style="display: flex; gap: 6px;">
            <button class="btn" style="background:var(--hk-blue)" onclick="addRecord('dep')">存入</button>
            <button class="btn" style="background:var(--withdraw)" onclick="addRecord('with')">提款</button>
        </div>
    </div>

    <div class="input-card" style="border-left: 4px solid var(--hk-orange);">
        <div class="input-row" style="margin-bottom:0">
            <div class="field" style="flex: 0.6;"><label>📈 利率%</label><input type="number" id="rateVal" placeholder="%"></div>
            <div class="field"><label>📅 生效日期</label><input type="date" id="rateDate"></div>
            <button class="btn" style="background:var(--hk-orange); flex: 0.5;" onclick="addRecord('rate')">更新</button>
        </div>
        <div class="sync-option">
            <input type="checkbox" id="applyAll" checked> <label for="applyAll">同步至所有帳戶</label>
        </div>
    </div>
</div>

<div class="log-container" id="logList"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwjWG0VNOh5X-XigkCtX24GiaDxIvm9EgNVY8iQwg36mAr2TUVtArqq9pFSIReP3MQv/exec';
    let db = { current: "預設帳戶", accounts: { "預設帳戶": [] } };

    const todayStr = new Date().toLocaleDateString('sv-SE');
    ['transDate', 'rateDate', 'targetDate'].forEach(id => document.getElementById(id).value = todayStr);

    async function pull() {
        try {
            const r = await fetch(`${SCRIPT_URL}?action=read`);
            const data = await r.json();
            if (data && data.accounts) db = data;
            renderTabs(); runCalculation();
            document.getElementById('syncStatus').innerText = "● 雲端資料已同步";
        } catch (e) { document.getElementById('syncStatus').innerText = "× 同步失敗"; }
    }

    async function push() {
        document.getElementById('syncStatus').innerText = "📤 儲存中...";
        await fetch(`${SCRIPT_URL}?action=write&data=${encodeURIComponent(JSON.stringify(db))}`, { mode: 'no-cors' });
        runCalculation(); setTimeout(pull, 1000);
    }

    function renderTabs() {
        const tabs = document.getElementById('accountTabs');
        tabs.innerHTML = Object.keys(db.accounts).map(n => 
            `<button class="tab ${n===db.current?'active':''}" onclick="db.current='${n}';renderTabs();runCalculation();">${n}</button>`
        ).join('') + `<button class="tab" onclick="addAcc()">+</button>`;
        document.getElementById('accountTitle').innerText = db.current;
    }

    function addAcc() {
        const n = prompt("帳戶名稱：");
        if (n && !db.accounts[n]) { db.accounts[n] = []; db.current = n; push(); }
    }

    function addRecord(type) {
        let valInput = (type === 'rate') ? 'rateVal' : 'transAmt';
        let dateInput = (type === 'rate') ? 'rateDate' : 'transDate';
        let val = document.getElementById(valInput).value;
        let date = document.getElementById(dateInput).value;
        if (!val) return;
        const record = { id: Date.now(), type, date, value: parseFloat(val) };
        if (type === 'rate' && document.getElementById('applyAll').checked) {
            Object.keys(db.accounts).forEach((acc, idx) => db.accounts[acc].push({ ...record, id: Date.now() + idx }));
        } else { db.accounts[db.current].push(record); }
        document.getElementById(valInput).value = ''; push();
    }

    function delRecord(id) {
        if(confirm("確定刪除？")) {
            db.accounts[db.current] = db.accounts[db.current].filter(x => x.id !== id);
            push();
        }
    }

    function runCalculation() {
        const history = db.accounts[db.current] || [];
        const sorted = [...history].sort((a,b) => new Date(a.date) - new Date(b.date));
        const targetStr = document.getElementById('targetDate').value;
        const targetDate = new Date(targetStr); targetDate.setHours(0,0,0,0);
        const today = new Date(); today.setHours(0,0,0,0);
        
        document.getElementById('mainCard').className = targetDate > today ? 'display-card is-predicting' : 'display-card';

        let p = 0, r = 0, acc = 0, html = "";
        let iter = sorted.length ? new Date(sorted[0].date) : new Date();
        iter.setHours(0,0,0,0);

        while (iter <= new Date(targetStr)) {
            const dStr = iter.toLocaleDateString('sv-SE');
            const isFuture = iter > today;
            
            sorted.filter(x => x.date === dStr).forEach(item => {
                let sign = "", amtClass = "";
                if (item.type === 'rate') {
                    r = item.value / 100;
                    sign = ""; amtClass = "";
                } else {
                    p += (item.type === 'dep' ? item.value : -item.value);
                    sign = item.type === 'dep' ? "+" : "-";
                    amtClass = item.type === 'dep' ? "amt-pos" : "amt-neg";
                }
                
                html = `<div class="log-item ${isFuture?'predict-row':''}">
                    <div class="log-info">
                        <span class="log-date">${item.date}${isFuture?' (預測)':''}</span>
                        <span style="font-size:13px">${item.type==='rate'?'📈 利率更新':(item.type==='dep'?'📥 存入':'📤 提款')}</span>
                    </div>
                    <div class="log-amt-wrapper">
                        <span class="log-amt ${amtClass}">${sign}${item.type==='rate' ? item.value+'%' : item.value.toFixed(2)}</span>
                        <button class="del-btn" onclick="delRecord(${item.id})">🗑️</button>
                    </div>
                </div>` + html;
            });

            if (iter.getDate() === 1 && acc > 0) {
                p += acc;
                html = `<div class="log-item" style="background:#f0faff">
                    <div class="log-info"><span class="log-date">${dStr}</span><span style="font-weight:bold;color:var(--hk-blue);font-size:12px">🔄 利息自動結算</span></div>
                    <div class="log-amt-wrapper">
                        <span class="log-amt amt-int">+${acc.toFixed(2)}</span>
                        <div style="width:24px"></div>
                    </div>
                </div>` + html;
                acc = 0;
            }
            if (iter < targetDate && p > 0 && r > 0) acc += (p * r) / 365;
            iter.setDate(iter.getDate() + 1);
        }
        document.getElementById('totalDisplay').innerText = `HK$ ${(p+acc).toLocaleString(undefined,{minimumFractionDigits:2})}`;
        document.getElementById('breakdownDisplay').innerText = `本金: ${p.toLocaleString()} | 利息: ${acc.toFixed(2)}`;
        document.getElementById('logList').innerHTML = html;
    }
    pull();
</script>
</body>
</html>
