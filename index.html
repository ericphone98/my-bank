<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>活期存摺</title>
    <style>
        :root { --hk-blue: #007aff; --hk-orange: #ff9500; --bg: #f2f2f7; --card-bg: #ffffff; --predict: #5856d6; --withdraw: #ff453a; --predict-bg: #f5f3ff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* 頂部不捲動區域 */
        .header-fixed { flex-shrink: 0; }
        
        .account-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
        .account-tabs::-webkit-scrollbar { display: none; }
        .tab { padding: 8px 16px; background: #e5e5ea; border-radius: 10px; font-size: 13px; white-space: nowrap; border: none; color: #3a3a3c; }
        .tab.active { background: var(--hk-blue); color: white; font-weight: bold; }

        /* 主卡片：整合了預測日期選擇 */
        .display-card { 
            background: var(--hk-blue); color: white; padding: 15px 20px; border-radius: 20px; 
            margin-bottom: 10px; position: relative; transition: 0.3s;
        }
        .display-card.is-predicting { background: var(--predict); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .amount { font-size: 32px; font-weight: bold; display: block; margin: 5px 0; }
        .breakdown { font-size: 12px; opacity: 0.9; }
        
        /* 預測日期縮小至卡片內 */
        .target-box { background: rgba(255,255,255,0.2); border-radius: 8px; padding: 4px 8px; border: none; color: white; font-size: 11px; }

        .input-card { background: var(--card-bg); padding: 12px; border-radius: 15px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .btn-row { display: flex; gap: 8px; align-items: flex-end; }
        label { display: block; font-size: 10px; color: #8e8e93; margin-bottom: 3px; font-weight: bold; }
        input { width: 100%; padding: 8px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 15px; background: #f9f9f9; }
        
        .btn { padding: 10px; border: none; border-radius: 10px; font-weight: bold; color: white; font-size: 14px; cursor: pointer; }
        .btn-blue { background: var(--hk-blue); flex: 1; }
        .btn-red { background: var(--withdraw); flex: 1; }
        .btn-orange { background: var(--hk-orange); padding: 8px 15px; }

        /* 紀錄區域：極大化 */
        .log-container { flex-grow: 1; overflow-y: auto; background: white; border-radius: 15px; -webkit-overflow-scrolling: touch; }
        .log-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid #f2f2f7; align-items: center; }
        .log-item.predict-row { background: var(--predict-bg); }
        .log-info { display: flex; flex-direction: column; }
        .log-date { font-size: 10px; color: #8e8e93; }
        .log-amt { font-weight: 600; font-size: 15px; }
        .amt-pos { color: #34c759; }
        .amt-neg { color: var(--withdraw); }
        
        #syncStatus { text-align:center; font-size:10px; color:#8e8e93; margin-bottom:5px; }
        .action-btns button { border: none; background: none; font-size: 16px; padding: 0 5px; }
    </style>
</head>
<body>

<div class="header-fixed">
    <div id="syncStatus">● 雲端同步中...</div>
    <div class="account-tabs" id="accountTabs"></div>

    <div class="display-card" id="mainCard">
        <div class="card-top">
            <div>
                <small id="accountTitle" style="font-weight: bold;">我的帳戶</small>
                <span id="modeTag"></span>
            </div>
            <div style="text-align: right;">
                <label style="color: white; opacity: 0.8; font-size: 9px;">🔭 預測至</label>
                <input type="date" id="targetDate" class="target-box" onchange="runCalculation()">
            </div>
        </div>
        <span class="amount" id="totalDisplay">HK$ 0.00</span>
        <div class="breakdown" id="breakdownDisplay">本金: 0.00 | 利息: 0.00</div>
    </div>

    <div class="input-card" id="moneyCard">
        <div class="btn-row">
            <div style="flex: 1.2;"><label>💰 金額</label><input type="number" id="transAmt" placeholder="0.00" inputmode="decimal"></div>
            <div style="flex: 1;"><label>📅 日期</label><input type="date" id="transDate"></div>
            <button class="btn btn-blue" id="btnDep" onclick="addRecord('dep')">存入</button>
            <button class="btn btn-red" id="btnWith" onclick="addRecord('with')">提款</button>
            <button class="btn btn-orange" id="btnEdit" style="display:none" onclick="saveEdit()">儲存</button>
        </div>
    </div>

    <div class="input-card" style="padding: 8px 12px; border-left: 5px solid var(--hk-orange);">
        <div class="btn-row">
            <div style="flex: 0.8;"><label>📈 利率%</label><input type="number" id="rateVal" placeholder="0.00"></div>
            <div style="flex: 1.2;"><label>📅 生效日</label><input type="date" id="rateDate"></div>
            <button class="btn btn-orange" onclick="addRecord('rate')">更新</button>
        </div>
    </div>
</div>

<div class="log-container" id="logList"></div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwjWG0VNOh5X-XigkCtX24GiaDxIvm9EgNVY8iQwg36mAr2TUVtArqq9pFSIReP3MQv/exec';
    let db = { current: "預設帳戶", accounts: { "預設帳戶": [] } };
    let editingId = null;

    const todayStr = new Date().toLocaleDateString('sv-SE');
    ['transDate', 'rateDate', 'targetDate'].forEach(id => document.getElementById(id).value = todayStr);

    async function pull() {
        try {
            const r = await fetch(`${SCRIPT_URL}?action=read`);
            const data = await r.json();
            if (data && data.accounts) db = data;
            renderTabs(); runCalculation();
            document.getElementById('syncStatus').innerText = "● 雲端資料已同步";
        } catch (e) { document.getElementById('syncStatus').innerText = "× 同步失敗"; }
    }

    async function push() {
        document.getElementById('syncStatus').innerText = "📤 正在儲存...";
        await fetch(`${SCRIPT_URL}?action=write&data=${encodeURIComponent(JSON.stringify(db))}`, { mode: 'no-cors' });
        runCalculation(); setTimeout(pull, 1000);
    }

    function renderTabs() {
        const tabs = document.getElementById('accountTabs');
        tabs.innerHTML = Object.keys(db.accounts).map(n => 
            `<button class="tab ${n===db.current?'active':''}" onclick="db.current='${n}';renderTabs();runCalculation();">${n}</button>`
        ).join('') + `<button class="tab" onclick="addAcc()">+ 新增</button>`;
        document.getElementById('accountTitle').innerText = db.current;
    }

    function addAcc() {
        const n = prompt("輸入帳戶名稱：");
        if (n && !db.accounts[n]) { db.accounts[n] = []; db.current = n; push(); }
    }

    function addRecord(type) {
        let val = (type === 'rate') ? document.getElementById('rateVal').value : document.getElementById('transAmt').value;
        let date = (type === 'rate') ? document.getElementById('rateDate').value : document.getElementById('transDate').value;
        if (!val) return;
        db.accounts[db.current].push({ id: Date.now(), type, date, value: parseFloat(val) });
        document.getElementById('transAmt').value = ''; push();
    }

    function startEdit(id) {
        editingId = id;
        const r = db.accounts[db.current].find(x => x.id === id);
        document.getElementById('transAmt').value = r.value;
        document.getElementById('transDate').value = r.date;
        document.getElementById('btnDep').style.display = 'none';
        document.getElementById('btnWith').style.display = 'none';
        document.getElementById('btnEdit').style.display = 'block';
        document.getElementById('moneyCard').style.border = "2px solid var(--hk-orange)";
    }

    function saveEdit() {
        const idx = db.accounts[db.current].findIndex(x => x.id === editingId);
        db.accounts[db.current][idx].value = parseFloat(document.getElementById('transAmt').value);
        db.accounts[db.current][idx].date = document.getElementById('transDate').value;
        editingId = null;
        document.getElementById('btnDep').style.display = 'block';
        document.getElementById('btnWith').style.display = 'block';
        document.getElementById('btnEdit').style.display = 'none';
        document.getElementById('moneyCard').style.border = "none";
        push();
    }

    function delRecord(id) {
        if(confirm("刪除此紀錄？")) {
            db.accounts[db.current] = db.accounts[db.current].filter(x => x.id !== id);
            push();
        }
    }

    function runCalculation() {
        const history = db.accounts[db.current] || [];
        const sorted = [...history].sort((a,b) => new Date(a.date) - new Date(b.date));
        const targetStr = document.getElementById('targetDate').value;
        const targetDate = new Date(targetStr); targetDate.setHours(0,0,0,0);
        const today = new Date(); today.setHours(0,0,0,0);
        
        const isPredicting = targetDate > today;
        document.getElementById('mainCard').className = isPredicting ? 'display-card is-predicting' : 'display-card';

        let p = 0, r = 0, acc = 0, html = "";
        let iter = sorted.length ? new Date(sorted[0].date) : new Date();
        iter.setHours(0,0,0,0);

        while (iter <= new Date(targetStr)) {
            const dStr = iter.toLocaleDateString('sv-SE');
            const isFuture = iter > today;
            
            sorted.filter(x => x.date === dStr).forEach(item => {
                if (item.type === 'rate') r = item.value / 100;
                else p += (item.type === 'dep' ? item.value : -item.value);
                
                html = `<div class="log-item ${isFuture?'predict-row':''}">
                    <div class="log-info">
                        <span class="log-date">${item.date}${isFuture?' (預測)':''}</span>
                        <span style="font-size:13px">${item.type==='rate'?'📈 利率更新':(item.type==='dep'?'📥 存入':'📤 提款')}</span>
                    </div>
                    <div style="display:flex; align-items:center;">
                        <span class="log-amt ${item.type==='dep'?'amt-pos':'amt-neg'}">${item.type==='rate' ? item.value+'%' : item.value.toFixed(2)}</span>
                        <div class="action-btns">
                            <button onclick="startEdit(${item.id})">✏️</button>
                            <button onclick="delRecord(${item.id})">🗑️</button>
                        </div>
                    </div>
                </div>` + html;
            });

            if (iter.getDate() === 1 && acc > 0) {
                p += acc;
                html = `<div class="log-item" style="background:#f0faff">
                    <div class="log-info"><span class="log-date">${dStr}</span><span style="font-weight:bold;color:var(--hk-blue)">🔄 利息自動結算</span></div>
                    <span class="log-amt" style="color:var(--predict)">+${acc.toFixed(2)}</span>
                    <div style="width:60px"></div>
                </div>` + html;
                acc = 0;
            }
            if (iter < targetDate && p > 0 && r > 0) acc += (p * r) / 365;
            iter.setDate(iter.getDate() + 1);
        }
        document.getElementById('totalDisplay').innerText = `HK$ ${(p+acc).toLocaleString(undefined,{minimumFractionDigits:2})}`;
        document.getElementById('breakdownDisplay').innerText = `本金: ${p.toLocaleString()} | 利息: ${acc.toFixed(2)}`;
        document.getElementById('logList').innerHTML = html;
    }

    pull();
</script>
</body>
</html>
