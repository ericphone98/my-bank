<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>活期存摺</title>
    <style>
        :root { --hk-blue: #007aff; --hk-orange: #ff9500; --bg: #f2f2f7; --card-bg: #ffffff; --predict: #5856d6; --withdraw: #ff453a; --success: #34c759; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100dvh; margin: 0; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; }
        body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) 0 0 0; }

        .top-panel { flex-shrink: 0; background: var(--bg); padding: 5px 12px 0 12px; z-index: 10; }
        .account-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .tab { padding: 4px 10px; background: #e5e5ea; border-radius: 8px; font-size: 11px; white-space: nowrap; border: none; }
        .tab.active { background: var(--hk-blue); color: white; font-weight: bold; }

        .display-card { background: var(--hk-blue); color: white; padding: 12px 15px; border-radius: 18px; margin-bottom: 8px; transition: background 0.3s; }
        .display-card.is-predicting { background: var(--predict); }
        .card-header { display: flex; justify-content: flex-end; }
        .amount { font-size: 32px; font-weight: bold; margin: 0; }
        .breakdown { font-size: 11px; opacity: 0.85; margin-top: 4px; }
        
        .predict-box { text-align: right; }
        .predict-box label { color: rgba(255,255,255,0.7); font-size: 9px; display: block; margin-bottom: 2px; }
        .predict-box input { background: rgba(255,255,255,0.2); border: none; color: white; font-size: 10px; padding: 0 5px; border-radius: 6px; width: 105px; height: 24px; outline: none; }

        .input-card { background: var(--card-bg); padding: 10px; border-radius: 14px; margin-bottom: 6px; border: 2px solid transparent; }
        .input-card.editing { border-color: var(--hk-orange); background: #fffdf5; }
        .input-row { display: flex; gap: 10px; margin-bottom: 8px; align-items: flex-end; }
        .field-main { flex: 2; }
        .field-date { flex: 1.3; }
        label { display: block; font-size: 9px; color: #8e8e93; margin-bottom: 3px; font-weight: bold; }
        input { width: 100%; padding: 0 8px; border: 1px solid #d1d1d6; border-radius: 8px; font-size: 14px; background: #f9f9f9; height: 36px; }

        .btn-row { display: flex; gap: 6px; }
        .btn { flex: 1; border: none; border-radius: 8px; font-weight: bold; color: white; font-size: 13px; height: 36px; cursor: pointer; }
        .btn-blue { background: var(--hk-blue); }
        .btn-red { background: var(--withdraw); }
        .btn-orange { background: var(--hk-orange); }
        .btn-success { background: var(--success); }
        .btn-gray { background: #8e8e93; }

        /* 核心修復：垂直置中佈局 */
        .log-section { flex: 1; background: white; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; border-top: 1px solid #e5e5ea; position: relative; }
        #logList { overflow-y: auto; flex: 1; padding-bottom: 60px; }
        
        .log-item { 
            display: flex; 
            justify-content: space-between; 
            padding: 14px 15px; 
            border-bottom: 1px solid #f2f2f7; 
            align-items: center; /* 關鍵：強制所有子元素在垂直中心對齊 */
            min-height: 56px; /* 確保行高統一 */
        }
        
        .log-info { 
            flex: 1; 
            min-width: 0; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; /* 確保左側文字垂直置中 */
        }
        
        .log-date { font-size: 10px; color: #8e8e93; line-height: 1.2; }
        .log-type-label { font-size: 12px; font-weight: 500; line-height: 1.4; margin-top: 2px; }
        
        .log-amt { 
            font-family: -apple-system, sans-serif;
            font-variant-numeric: tabular-nums; 
            font-weight: 700; 
            font-size: 16px; 
            text-align: right; 
            min-width: 100px;
            margin-left: 10px;
            display: flex;
            align-items: center; /* 數字內部對齊 */
            justify-content: flex-end;
            line-height: 1; /* 消除預設行高偏移 */
        }

        .action-group { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            flex: 0 0 70px; 
            justify-content: flex-end; 
            margin-left: 10px;
        }

        .icon-svg { width: 18px; height: 18px; fill: #b0b0b7; cursor: pointer; }
        .amt-pos { color: #34c759; }
        .amt-neg { color: var(--withdraw); }
        .amt-int { color: var(--predict); }

        .bottom-bar { 
            position: absolute; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.85); backdrop-filter: blur(10px); 
            padding: 8px 15px calc(8px + env(safe-area-inset-bottom)); 
            display: flex; justify-content: center; gap: 25px;
            border-top: 0.5px solid #e5e5ea;
        }
        .btn-small-mng { background: none; border: none; color: #8e8e93; font-size: 10px; padding: 4px 8px; border-radius: 12px; border: 1px solid #e5e5ea; }
        .btn-small-del { color: #ff3b30; border-color: #ffcccc; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="top-panel">
        <div id="syncStatus" style="font-size:9px; text-align:center; color:#8e8e93; margin-bottom:2px;">同步中...</div>
        <div class="account-tabs" id="accountTabs"></div>

        <div class="display-card" id="mainCard">
            <div class="card-header">
                <div class="predict-box">
                    <label id="predictLabel">📅 今日</label>
                    <input type="date" id="targetDate" onchange="runCalculation()">
                </div>
            </div>
            <span class="amount" id="totalDisplay">HK$ 0.00</span>
            <div class="breakdown" id="breakdownDisplay">本金: 0.00 | 利息: 0.00</div>
        </div>

        <div class="input-card" id="rateInputCard" style="border-left: 4px solid var(--hk-orange);">
            <div id="rateNormalUI">
                <div class="input-row">
                    <div class="field-main"><label>📈 年利率 %</label><input type="number" id="rateVal" placeholder="0.00" inputmode="decimal"></div>
                    <div class="field-date"><label>📅 生效日期</label><input type="date" id="rateDate"></div>
                </div>
                <button class="btn btn-orange" style="width:100%;" onclick="addRecord('rate')">更新利率</button>
            </div>
            <div id="rateEditUI" class="hidden">
                <div class="input-row">
                    <div class="field-main"><label>📈 修改利率 %</label><input type="number" id="editRateVal"></div>
                    <div class="field-date"><label>📅 修改生效日</label><input type="date" id="editRateDate"></div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-success" onclick="confirmEdit('rate')">✅ 完成</button>
                    <button class="btn btn-gray" onclick="cancelEdit()">❌ 取消</button>
                </div>
            </div>
        </div>

        <div class="input-card" id="moneyInputCard" style="border-top: 2px solid var(--hk-blue);">
            <div id="moneyNormalUI">
                <div class="input-row">
                    <div class="field-main"><label>💰 存/提金額</label><input type="number" id="transAmt" placeholder="0.00" inputmode="decimal"></div>
                    <div class="field-date"><label>📅 交易日期</label><input type="date" id="transDate"></div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-blue" onclick="addRecord('dep')">存入</button>
                    <button class="btn btn-red" onclick="addRecord('with')">提款</button>
                </div>
            </div>
            <div id="moneyEditUI" class="hidden">
                <div class="input-row">
                    <div class="field-main"><label>💰 修改金額</label><input type="number" id="editTransAmt"></div>
                    <div class="field-date"><label>📅 修改日期</label><input type="date" id="editTransDate"></div>
                </div>
                <div class="btn-row">
                    <button class="btn btn-success" onclick="confirmEdit('money')">✅ 完成</button>
                    <button class="btn btn-gray" onclick="cancelEdit()">❌ 取消</button>
                </div>
            </div>
        </div>
    </div>

    <div class="log-section">
        <div id="logList"></div>
        <div class="bottom-bar">
            <button class="btn-small-mng" onclick="handleReset()">🧹 重設紀錄</button>
            <button class="btn-small-mng btn-small-del" onclick="handleDelete()">🗑️ 刪除帳戶</button>
        </div>
    </div>

<script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwjWG0VNOh5X-XigkCtX24GiaDxIvm9EgNVY8iQwg36mAr2TUVtArqq9pFSIReP3MQv/exec';
    let db = { current: "預設帳戶", accounts: { "預設帳戶": [] } };
    let pendingEditId = null;

    const todayStr = new Date().toLocaleDateString('sv-SE');
    ['transDate', 'rateDate', 'targetDate'].forEach(id => document.getElementById(id).value = todayStr);

    async function pull() {
        try {
            const r = await fetch(`${SCRIPT_URL}?action=read`);
            const data = await r.json();
            if (data && data.accounts) db = data;
            renderTabs(); runCalculation();
            document.getElementById('syncStatus').innerText = "● 雲端同步中";
        } catch (e) { document.getElementById('syncStatus').innerText = "× 同步失敗"; }
    }

    async function push() {
        document.getElementById('syncStatus').innerText = "📤 儲存中...";
        await fetch(`${SCRIPT_URL}?action=write&data=${encodeURIComponent(JSON.stringify(db))}`, { mode: 'no-cors' });
        runCalculation(); setTimeout(pull, 1000);
    }

    function renderTabs() {
        const tabs = document.getElementById('accountTabs');
        tabs.innerHTML = Object.keys(db.accounts).map(n => 
            `<button class="tab ${n===db.current?'active':''}" onclick="db.current='${n}';renderTabs();runCalculation();">${n}</button>`
        ).join('') + `<button class="tab" onclick="addAcc()">+</button>`;
    }

    function addAcc() {
        const n = prompt("新帳戶名稱：");
        if (n && !db.accounts[n]) { db.accounts[n] = []; db.current = n; push(); }
    }

    function handleReset() { if (confirm(`確定清空 [${db.current}] 紀錄？`)) { db.accounts[db.current] = []; push(); } }
    function handleDelete() {
        if (Object.keys(db.accounts).length <= 1) return alert("不能刪除最後一個帳戶");
        if (confirm(`確定刪除 [${db.current}] 帳戶？`)) { delete db.accounts[db.current]; db.current = Object.keys(db.accounts)[0]; push(); }
    }

    function addRecord(type) {
        let val = (type === 'rate') ? document.getElementById('rateVal').value : document.getElementById('transAmt').value;
        let date = (type === 'rate') ? document.getElementById('rateDate').value : document.getElementById('transDate').value;
        if (!val) return;
        db.accounts[db.current].push({ id: Date.now(), type: (type==='rate'?'rate':(type==='dep'?'dep':'with')), date, value: parseFloat(val) });
        push();
        document.getElementById(type === 'rate' ? 'rateVal' : 'transAmt').value = '';
    }

    function startEdit(id, type, val, date) {
        cancelEdit();
        pendingEditId = id;
        if (type === 'rate') {
            document.getElementById('editRateVal').value = val;
            document.getElementById('editRateDate').value = date;
            document.getElementById('rateNormalUI').classList.add('hidden');
            document.getElementById('rateEditUI').classList.remove('hidden');
        } else {
            document.getElementById('editTransAmt').value = Math.abs(val);
            document.getElementById('editTransDate').value = date;
            document.getElementById('moneyNormalUI').classList.add('hidden');
            document.getElementById('moneyEditUI').classList.remove('hidden');
        }
    }

    function confirmEdit(mode) {
        let val = (mode === 'rate') ? document.getElementById('editRateVal').value : document.getElementById('editTransAmt').value;
        let date = (mode === 'rate') ? document.getElementById('editRateDate').value : document.getElementById('editTransDate').value;
        const oldRec = db.accounts[db.current].find(x => x.id === pendingEditId);
        db.accounts[db.current] = db.accounts[db.current].filter(x => x.id !== pendingEditId);
        db.accounts[db.current].push({ id: Date.now(), type: oldRec.type, date: date, value: parseFloat(val) });
        cancelEdit(); push();
    }

    function cancelEdit() {
        pendingEditId = null;
        document.getElementById('rateNormalUI').classList.remove('hidden');
        document.getElementById('rateEditUI').classList.add('hidden');
        document.getElementById('moneyNormalUI').classList.remove('hidden');
        document.getElementById('moneyEditUI').classList.add('hidden');
        runCalculation();
    }

    function delRecord(id) { if(confirm("確定刪除此紀錄？")) { db.accounts[db.current] = db.accounts[db.current].filter(x => x.id !== id); push(); } }

    function runCalculation() {
        const history = db.accounts[db.current] || [];
        const sorted = [...history].sort((a,b) => new Date(a.date) - new Date(b.date));
        const inputDateStr = document.getElementById('targetDate').value;
        const inputDate = new Date(inputDateStr); inputDate.setHours(0,0,0,0);
        const today = new Date(); today.setHours(0,0,0,0);
        const todayStrLocal = today.toLocaleDateString('sv-SE');
        
        let labelText = "📅 結算至";
        if (inputDateStr === todayStrLocal) labelText = "📅 今日";
        else if (inputDate > today) labelText = "🔭 預測至";
        
        document.getElementById('mainCard').className = (inputDate > today) ? 'display-card is-predicting' : 'display-card';
        document.getElementById('predictLabel').innerText = labelText;

        let p = 0, r = 0, acc = 0, html = "";
        let iter = (sorted.length > 0) ? new Date(sorted[0].date) : new Date();
        iter.setHours(0,0,0,0);

        const editSvg = `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
        const delSvg = `<svg class="icon-svg" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

        while (iter <= inputDate) {
            const dStr = iter.toLocaleDateString('sv-SE');
            sorted.filter(x => x.date === dStr).forEach(item => {
                let sign = "", amtClass = "", name = "";
                if (item.type === 'rate') { r = item.value / 100; name = "📈 利率: " + item.value + "%"; } 
                else {
                    p += (item.type === 'dep' ? item.value : -item.value);
                    name = item.type === 'dep' ? "📥 存入" : "📤 提款";
                    sign = item.type === 'dep' ? "+" : "-";
                    amtClass = item.type === 'dep' ? "amt-pos" : "amt-neg";
                }
                html = `<div class="log-item">
                    <div class="log-info">
                        <span class="log-date">${item.date}</span>
                        <span class="log-type-label">${name}</span>
                    </div>
                    <span class="log-amt ${amtClass}">${sign}${item.type==='rate' ? '' : item.value.toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                    <div class="action-group">
                        <div onclick="startEdit(${item.id}, '${item.type}', ${item.value}, '${item.date}')">${editSvg}</div>
                        <div onclick="delRecord(${item.id})">${delSvg}</div>
                    </div>
                </div>` + html;
            });
            if (iter.getDate() === 1 && acc > 0) {
                p += acc;
                html = `<div class="log-item" style="background:#f0faff">
                    <div class="log-info">
                        <span class="log-date">${dStr}</span>
                        <span class="log-type-label" style="font-weight:bold;color:var(--hk-blue);">🔄 利息存入</span>
                    </div>
                    <span class="log-amt amt-int">+${acc.toLocaleString(undefined,{minimumFractionDigits:2})}</span>
                    <div class="action-group"></div>
                </div>` + html;
                acc = 0;
            }
            if (iter < inputDate && p > 0 && r > 0) acc += (p * r) / 365;
            iter.setDate(iter.getDate() + 1);
        }
        document.getElementById('totalDisplay').innerText = `HK$ ${(p+acc).toLocaleString(undefined,{minimumFractionDigits:2})}`;
        document.getElementById('breakdownDisplay').innerText = `本金: ${p.toLocaleString(undefined,{minimumFractionDigits:2})} | 利息: ${acc.toLocaleString(undefined,{minimumFractionDigits:2})}`;
        document.getElementById('logList').innerHTML = html || '<div style="padding:20px; text-align:center; color:#ccc;">尚無紀錄</div>';
    }
    pull();
</script>
</body>
</html>
